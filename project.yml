name: NutritionTracker

options:
  bundleIdPrefix: com.felix
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_VERSION: '5.9'
    # iPhone only (1). The spec targets a native iPhone app.
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic

targets:
  NutritionTracker:
    type: application
    platform: iOS
    sources:
      - path: NutritionTracker
    settings:
      base:
        # Must stay stable across CI builds: Sideloadly re-signs and reinstalls
        # over the existing install, and changing this breaks that continuity.
        PRODUCT_BUNDLE_IDENTIFIER: com.felix.NutritionTracker
        PRODUCT_NAME: NutritionTracker
        MARKETING_VERSION: '2.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: YES
        # Custom keys merged into the generated Info.plist (see the file).
        INFOPLIST_FILE: Config/AppConfig-Info.plist
        # Assistant configuration. Empty here on purpose; CI fills these from
        # GitHub secrets/variables via an xcconfig. Never commit real values.
        ASSISTANT_API_KEY: ''
        ASSISTANT_MODEL: ''
        ASSISTANT_BASE_URL: ''
        INFOPLIST_KEY_CFBundleDisplayName: Nutrition Tracker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Portrait-only on purpose; full screen tells iOS that is intended.
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Used to photograph food for nutrition analysis and to scan product barcodes.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Used to pick a single food photo to analyse.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  NutritionTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NutritionTrackerTests
    dependencies:
      - target: NutritionTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.felix.NutritionTrackerTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NutritionTracker:
    build:
      targets:
        NutritionTracker: all
        NutritionTrackerTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - NutritionTrackerTests
    run:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
