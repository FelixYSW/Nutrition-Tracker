name: Build iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Xcode version
        run: xcodebuild -version
      - name: Generate project
        run: xcodegen generate
      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project NutritionTracker.xcodeproj -scheme NutritionTracker
      - name: Test
        run: xcodebuild test -project NutritionTracker.xcodeproj -scheme NutritionTracker -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO
      - name: Release build
        run: xcodebuild build -project NutritionTracker.xcodeproj -scheme NutritionTracker -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name 'NutritionTracker.app' -type d -print -quit)"
          if [[ -z "$app" ]]; then echo 'NutritionTracker.app not found'; exit 1; fi
          mkdir -p Payload
          cp -R "$app" Payload/NutritionTracker.app
          zip -qry NutritionTracker-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NutritionTracker-unsigned
          path: NutritionTracker-unsigned.ipa
