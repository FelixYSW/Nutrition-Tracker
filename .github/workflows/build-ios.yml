name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NutritionTracker
    # macos-15 ships Xcode 26 (needed for Liquid Glass) alongside older Xcodes;
    # the step below selects it.
    runs-on: macos-15
    timeout-minutes: 45

    env:
      SCHEME: NutritionTracker
      APP_NAME: NutritionTracker

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 26
        # Liquid Glass (the iOS 26 tab bar, sliders, switches and glass effects)
        # comes from the iOS 26 SDK. An app built with an older Xcode runs in
        # compatibility mode on iOS 26 and keeps the old look. Newest stable
        # Xcode 26 is picked; betas are skipped.
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)"
          if [ -z "$XCODE" ]; then
            echo "::error::No stable Xcode 26 on this runner, so the app can't use Liquid Glass. Installed:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen and log formatter
        run: brew install xcodegen xcbeautify

      - name: Write assistant configuration
        # The assistant uses one built-in key (users can't configure it):
        #   ASSISTANT_API_KEY  secret, required for the assistant (an OpenAI key)
        #   ASSISTANT_MODEL    variable, optional; app default is gpt-6-luna
        #   ASSISTANT_BASE_URL variable, optional; app default is OpenAI's API
        #                      (https://api.openai.com/v1, Responses API)
        #   SEARCH_API_KEY     secret, optional; a Gemini key used only for web search
        #                      (brand nutrition, food nearby, products). The chat
        #                      always uses ASSISTANT_API_KEY; there is no fallback.
        #   SEARCH_MODEL       variable, optional; app default is gemini-2.5-flash
        # They go into a temporary xcconfig outside the repo rather than onto the
        # xcodebuild command line, which xcodebuild would echo into the log.
        # Without the key the app still builds; the assistant says "not available".
        #
        # WARNING: anyone with the IPA can extract this key. The repo is public,
        # and so are its artifacts to any signed-in GitHub user. Use a key with a
        # spending cap or a free tier - see the README.
        env:
          ASSISTANT_API_KEY: ${{ secrets.ASSISTANT_API_KEY }}
          ASSISTANT_MODEL: ${{ vars.ASSISTANT_MODEL }}
          ASSISTANT_BASE_URL: ${{ vars.ASSISTANT_BASE_URL }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          SEARCH_MODEL: ${{ vars.SEARCH_MODEL }}
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/assistant.xcconfig"
          # In xcconfig files "//" starts a comment, so escape it as "/$()/",
          # which Xcode expands back to "//" (needed for the https:// URL).
          esc() { printf '%s' "$1" | sed 's|//|/$()/|g'; }
          : > "$CONFIG"
          if [ -n "${ASSISTANT_API_KEY:-}" ]; then
            echo "::add-mask::$ASSISTANT_API_KEY"
            echo "ASSISTANT_API_KEY = $(esc "$ASSISTANT_API_KEY")" >> "$CONFIG"
            echo "Assistant key present; it will be built in (value not logged)."
          else
            echo "::warning::No ASSISTANT_API_KEY secret set; the assistant will show 'not available'."
          fi
          if [ -n "${ASSISTANT_MODEL:-}" ]; then
            echo "ASSISTANT_MODEL = $(esc "$ASSISTANT_MODEL")" >> "$CONFIG"
            echo "Model override: $ASSISTANT_MODEL"
          fi
          if [ -n "${ASSISTANT_BASE_URL:-}" ]; then
            echo "ASSISTANT_BASE_URL = $(esc "$ASSISTANT_BASE_URL")" >> "$CONFIG"
            echo "Base URL override: $ASSISTANT_BASE_URL"
          fi
          if [ -n "${SEARCH_API_KEY:-}" ]; then
            echo "::add-mask::$SEARCH_API_KEY"
            echo "SEARCH_API_KEY = $(esc "$SEARCH_API_KEY")" >> "$CONFIG"
            echo "Search key present; it will be built in (value not logged)."
          else
            echo "::warning::No SEARCH_API_KEY secret set; web search (brand lookups, food nearby) will say it isn't available."
          fi
          if [ -n "${SEARCH_MODEL:-}" ]; then
            echo "SEARCH_MODEL = $(esc "$SEARCH_MODEL")" >> "$CONFIG"
            echo "Search model override: $SEARCH_MODEL"
          fi
          # Stamp the GitHub run number as the build number, so Settings > About >
          # Version shows exactly which build is installed (e.g. "2.0 (42)").
          echo "CURRENT_PROJECT_VERSION = ${GITHUB_RUN_NUMBER}" >> "$CONFIG"
          echo "Build number: ${GITHUB_RUN_NUMBER}"
          echo "ASSISTANT_XCCONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Fetch trained models (optional)
        # The repo is public, so model files are not committed. If the
        # MODELS_URL secret points at a zip containing IngredientSegmenter.mlpackage
        # and/or NutritionEstimator.mlpackage (e.g. a Google Drive share link),
        # they are bundled into the app. Must run before project generation,
        # because XcodeGen only includes files that exist when it runs.
        env:
          MODELS_URL: ${{ secrets.MODELS_URL }}
        run: |
          set -euo pipefail
          if [ -z "${MODELS_URL:-}" ]; then
            echo "No MODELS_URL secret set; building without on-device models."
            exit 0
          fi
          URL="$MODELS_URL"
          # Turn a Drive "share" link into a direct download link.
          if [[ "$URL" =~ drive\.google\.com/file/d/([^/]+) ]]; then
            URL="https://drive.google.com/uc?export=download&id=${BASH_REMATCH[1]}"
          fi
          curl -fsSL "$URL" -o models.zip || { echo "::error::Could not download MODELS_URL. Is the file shared as 'Anyone with the link'?"; exit 1; }
          if ! unzip -tq models.zip >/dev/null 2>&1; then
            echo "::error::MODELS_URL did not return a zip file. Check the sharing setting."
            exit 1
          fi
          unzip -q -o models.zip -d NutritionTracker/Resources
          rm models.zip
          for model in IngredientSegmenter NutritionEstimator; do
            if [ -d "NutritionTracker/Resources/$model.mlpackage" ]; then
              echo "Bundling $model.mlpackage"
            else
              echo "::warning::$model.mlpackage not in the zip; the app will show it as not installed."
            fi
          done

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      # No "resolve package dependencies" step: the project has no Swift packages.

      - name: Run unit tests (iOS Simulator)
        run: |
          set -euo pipefail
          # Use whichever iPhone simulator this runner image actually has,
          # rather than hard-coding a model that may not exist.
          SIM_ID="$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,v in sorted(d.items(), reverse=True) if "iOS" in r for x in v if x["name"].startswith("iPhone")))')"
          echo "Testing on simulator $SIM_ID"
          xcodebuild test \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -destination "id=$SIM_ID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
          # Deleted 10 minutes after the run by the expire-downloads job; one
          # day is only the fallback if that job gets cancelled.
          retention-days: 1

      - name: Build Release for device (unsigned)
        run: |
          set -euo pipefail
          # The xcconfig holds the assistant settings (possibly none).
          xcodebuild clean build \
            -xcconfig "$ASSISTANT_XCCONFIG" \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | xcbeautify

      - name: Locate built .app
        id: locate
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app product was found in build/Build/Products/Release-iphoneos"
            find build/Build/Products -maxdepth 3 || true
            exit 1
          fi
          echo "Found: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Check assistant key is in the app
        # Reports presence only; never prints the value.
        run: |
          PLIST="${{ steps.locate.outputs.app_path }}/Info.plist"
          VALUE="$(/usr/libexec/PlistBuddy -c 'Print :AssistantAPIKey' "$PLIST" 2>/dev/null || true)"
          if [ -n "$VALUE" ] && [ "${VALUE#\$(}" = "$VALUE" ]; then
            echo "Assistant key is built into the app."
          else
            echo "::warning::The app has no assistant key, so the assistant will show 'not available'. Add the ASSISTANT_API_KEY secret."
          fi
          SEARCH_VALUE="$(/usr/libexec/PlistBuddy -c 'Print :SearchAPIKey' "$PLIST" 2>/dev/null || true)"
          if [ -n "$SEARCH_VALUE" ] && [ "${SEARCH_VALUE#\$(}" = "$SEARCH_VALUE" ]; then
            echo "Search key is built into the app."
          else
            echo "::warning::The app has no search key, so web search will say it isn't available. Add the SEARCH_API_KEY secret."
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf payload-staging
          mkdir -p payload-staging/Payload
          cp -R "${{ steps.locate.outputs.app_path }}" "payload-staging/Payload/$APP_NAME.app"
          (cd payload-staging && zip -qry "../$APP_NAME-unsigned.ipa" Payload)
          ls -lh "$APP_NAME-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v5
        with:
          name: NutritionTracker-unsigned-ipa
          path: NutritionTracker-unsigned.ipa
          if-no-files-found: error
          # The IPA contains the assistant key, and on a public repo any
          # signed-in GitHub user can download artifacts. The expire-downloads
          # job deletes it 10 minutes after the build; one day (GitHub's
          # minimum) is only the fallback if that job gets cancelled.
          retention-days: 1

  expire-downloads:
    name: Delete downloads after 10 minutes
    needs: build
    # Also after a failed build: test results may still have been uploaded.
    if: always()
    # Linux: free on public repos, and waiting here costs no macOS minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
      - name: Wait 10 minutes for the IPA to be downloaded
        run: sleep 600

      - name: Delete this run's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api --jq ".artifacts[].id" \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts")
          for id in $ids; do
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            echo "Deleted artifact $id"
          done
          [ -n "$ids" ] || echo "No artifacts to delete."
