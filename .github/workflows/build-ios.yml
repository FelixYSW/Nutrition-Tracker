name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NutritionTracker
    # macos-15 ships Xcode 16, which can open the project format that current
    # XcodeGen writes (objectVersion 77). Xcode 15 on macos-14 cannot.
    runs-on: macos-15
    timeout-minutes: 45

    env:
      SCHEME: NutritionTracker
      APP_NAME: NutritionTracker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE="$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen and log formatter
        run: brew install xcodegen xcbeautify

      - name: Resolve optional remote AI key
        # Only used when the optional REMOTE_AI_API_KEY secret exists. The value
        # is never echoed. It is passed to xcodebuild as an Info.plist key rather
        # than a generated Swift source file, so the app compiles identically
        # whether or not the secret is configured.
        #
        # WARNING: a key baked into an IPA can be extracted from the binary.
        # This path is for private personal builds only - see the README.
        env:
          REMOTE_AI_API_KEY: ${{ secrets.REMOTE_AI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${REMOTE_AI_API_KEY:-}" ]; then
            echo "::add-mask::$REMOTE_AI_API_KEY"
            echo "Remote AI key present; it will be injected (value not logged)."
            echo "HAS_REMOTE_KEY=1" >> "$GITHUB_ENV"
          else
            echo "No REMOTE_AI_API_KEY secret set; building without one."
            echo "HAS_REMOTE_KEY=0" >> "$GITHUB_ENV"
          fi

      - name: Fetch trained models (optional)
        # The repo is public, so model files are not committed. If the
        # MODELS_URL secret points at a zip containing IngredientSegmenter.mlpackage
        # and/or NutritionEstimator.mlpackage (e.g. a Google Drive share link),
        # they are bundled into the app. Must run before project generation,
        # because XcodeGen only includes files that exist when it runs.
        env:
          MODELS_URL: ${{ secrets.MODELS_URL }}
        run: |
          set -euo pipefail
          if [ -z "${MODELS_URL:-}" ]; then
            echo "No MODELS_URL secret set; building without on-device models."
            exit 0
          fi
          URL="$MODELS_URL"
          # Turn a Drive "share" link into a direct download link.
          if [[ "$URL" =~ drive\.google\.com/file/d/([^/]+) ]]; then
            URL="https://drive.google.com/uc?export=download&id=${BASH_REMATCH[1]}"
          fi
          curl -fsSL "$URL" -o models.zip || { echo "::error::Could not download MODELS_URL. Is the file shared as 'Anyone with the link'?"; exit 1; }
          if ! unzip -tq models.zip >/dev/null 2>&1; then
            echo "::error::MODELS_URL did not return a zip file. Check the sharing setting."
            exit 1
          fi
          unzip -q -o models.zip -d NutritionTracker/Resources
          rm models.zip
          for model in IngredientSegmenter NutritionEstimator; do
            if [ -d "NutritionTracker/Resources/$model.mlpackage" ]; then
              echo "Bundling $model.mlpackage"
            else
              echo "::warning::$model.mlpackage not in the zip; the app will show it as not installed."
            fi
          done

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      # No "resolve package dependencies" step: the project has no Swift packages.

      - name: Run unit tests (iOS Simulator)
        run: |
          set -euo pipefail
          # Use whichever iPhone simulator this runner image actually has,
          # rather than hard-coding a model that may not exist.
          SIM_ID="$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,v in sorted(d.items(), reverse=True) if "iOS" in r for x in v if x["name"].startswith("iPhone")))')"
          echo "Testing on simulator $SIM_ID"
          xcodebuild test \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -destination "id=$SIM_ID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore

      - name: Build Release for device (unsigned)
        env:
          REMOTE_AI_API_KEY: ${{ secrets.REMOTE_AI_API_KEY }}
        run: |
          set -euo pipefail
          # macOS runners use bash 3.2, where "${arr[@]}" on an empty array is an
          # "unbound variable" error under set -u. The ${arr[@]+...} form below
          # expands to nothing when the array is empty.
          EXTRA_SETTINGS=()
          if [ "${HAS_REMOTE_KEY}" = "1" ]; then
            EXTRA_SETTINGS+=("INFOPLIST_KEY_RemoteAIAPIKey=${REMOTE_AI_API_KEY}")
          fi
          xcodebuild clean build \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ${EXTRA_SETTINGS[@]+"${EXTRA_SETTINGS[@]}"} \
            | xcbeautify

      - name: Locate built .app
        id: locate
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app product was found in build/Build/Products/Release-iphoneos"
            find build/Build/Products -maxdepth 3 || true
            exit 1
          fi
          echo "Found: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf payload-staging
          mkdir -p payload-staging/Payload
          cp -R "${{ steps.locate.outputs.app_path }}" "payload-staging/Payload/$APP_NAME.app"
          (cd payload-staging && zip -qry "../$APP_NAME-unsigned.ipa" Payload)
          ls -lh "$APP_NAME-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NutritionTracker-unsigned-ipa
          path: NutritionTracker-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
